<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Edge-to-edge seamless background for PWA adaptive/maskable icons) -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="60%" stop-color="#FAF6F0" />
      <stop offset="100%" stop-color="#EFE6D8" />
    </radialGradient>
    <radialGradient id="plaqueGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FCF9F3" />
      <stop offset="100%" stop-color="#F2E8DC" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#7A4219" flood-opacity="0.22" />
    </filter>
    <filter id="stoneShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full Bleed Background Base (Fills entire 512x512 canvas so no weird squircle-inside-squircle or clipped edges appear on Android/iOS) -->
  <rect width="512" height="512" fill="url(#bgGlow)" />

  <!-- Centered Scaled Board Structure (Scale ~0.65 centered at (256, 256) - safe zone within 66% viewport) -->
  <!-- Center Plaque backing for crisp board contrast -->
  <rect x="86" y="86" width="340" height="340" rx="36" fill="url(#plaqueGlow)" stroke="#D4C3B3" stroke-width="2.5" opacity="0.85" filter="url(#shadow)" />

  <!-- Board Elements Group (Board coordinate scaled down by 0.68 from center) -->
  <!-- Outer Square: 245x245 -->
  <rect x="133.5" y="133.5" width="245" height="245" rx="20" fill="none" stroke="#7A4219" stroke-width="8.5" />

  <!-- Middle Square: 150x150 -->
  <rect x="181" y="181" width="150" height="150" rx="14" fill="none" stroke="#A06836" stroke-width="6.5" />

  <!-- Inner Square: 58x58 -->
  <rect x="227" y="227" width="58" height="58" rx="8" fill="none" stroke="#B8860B" stroke-width="5" />

  <!-- Connection Lines -->
  <!-- Top line -->
  <line x1="256" y1="133.5" x2="256" y2="227" stroke="#A06836" stroke-width="6.5" stroke-linecap="round" />
  <!-- Right line -->
  <line x1="378.5" y1="256" x2="285" y2="256" stroke="#A06836" stroke-width="6.5" stroke-linecap="round" />
  <!-- Bottom line -->
  <line x1="256" y1="378.5" x2="256" y2="285" stroke="#A06836" stroke-width="6.5" stroke-linecap="round" />
  <!-- Left line -->
  <line x1="133.5" y1="256" x2="227" y2="256" stroke="#A06836" stroke-width="6.5" stroke-linecap="round" />

  <!-- Center Decorative Grid Points / Gold Accent -->
  <circle cx="256" cy="256" r="4.5" fill="#D4AF37" />

  <!-- Stones around the perimeter (Sized comfortably within safe area) -->
  <g filter="url(#stoneShadow)">
    <!-- Top-Left (Gold) -->
    <circle cx="133.5" cy="133.5" r="15" fill="#D4AF37" stroke="#FFFFFF" stroke-width="3" />

    <!-- Top-Center (Dark Chocolate) -->
    <circle cx="256" cy="133.5" r="15" fill="#2C1810" stroke="#D4AF37" stroke-width="3" />

    <!-- Top-Right (Gold) -->
    <circle cx="378.5" cy="133.5" r="15" fill="#D4AF37" stroke="#FFFFFF" stroke-width="3" />

    <!-- Right-Center (Dark Chocolate) -->
    <circle cx="378.5" cy="256" r="15" fill="#2C1810" stroke="#D4AF37" stroke-width="3" />

    <!-- Bottom-Right (Gold) -->
    <circle cx="378.5" cy="378.5" r="15" fill="#D4AF37" stroke="#FFFFFF" stroke-width="3" />

    <!-- Bottom-Center (Dark Chocolate) -->
    <circle cx="256" cy="378.5" r="15" fill="#2C1810" stroke="#D4AF37" stroke-width="3" />

    <!-- Bottom-Left (Gold) -->
    <circle cx="133.5" cy="378.5" r="15" fill="#D4AF37" stroke="#FFFFFF" stroke-width="3" />

    <!-- Left-Center (Dark Chocolate) -->
    <circle cx="133.5" cy="256" r="15" fill="#2C1810" stroke="#D4AF37" stroke-width="3" />
  </g>
</svg>
